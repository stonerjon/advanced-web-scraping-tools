[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "piratecove-recon-toolkit"
version = "0.4.0"
description = "Authorized, read-only web and domain reconnaissance toolkit"
requires-python = ">=3.10"
dependencies = ["httpx>=0.27,<1"]

[project.optional-dependencies]
dns = ["dnspython>=2.6,<3"]
scraping = ["curl-cffi", "selectolax", "playwright-stealth"]
cloudflare = []
gateways = []
agent-cli = []
all = ["dnspython>=2.6,<3", "curl-cffi", "selectolax", "playwright-stealth"]
dev = ["pytest>=8", "ruff>=0.6"]

[project.scripts]
piratecove-recon = "main:main"

[tool.setuptools]
py-modules = ["main"]

[tool.setuptools.packages.find]
include = ["advanced_scraper*"]

[tool.ruff]
line-length = 140
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
